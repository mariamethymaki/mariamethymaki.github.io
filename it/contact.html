<script>
(function(){
  var path = window.location.pathname;
  var parts = path.split('/').filter(Boolean);
  // Detect current language and get the page filename
  var lang = '';
  var page = '';
  if(parts[0] === 'el' || parts[0] === 'it'){
    lang = parts[0];
    page = parts[1] || 'index.html';
  } else {
    page = parts[0] || 'index.html';
  }
  // Build cross-language URLs
  document.querySelector('#lang-en a').href = '/' + page;
  document.querySelector('#lang-it a').href = '/it/' + page;
  document.querySelector('#lang-el a').href = '/el/' + page;
  // Mark current language as active
  var activeLang = lang || 'en';
  document.querySelector('#lang-' + activeLang).classList.add('active');
})();
</script>

(function(){
  var path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('li[data-pages]').forEach(function(li){

    if(pages.indexOf(path) !== -1) li.classList.add('active');
  });
})();
